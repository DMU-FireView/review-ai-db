# AI 자체 결과 DB를 전용 볼륨에 보존한다. 미확정 수집 API는 기본 OFF.
services:
  ai:
    build: .
    container_name: review-ai
    ports:
      - "8000:8000"
    restart: unless-stopped
    init: true
    environment:
      AI_RESULT_DB_PATH: /service/data/ai-results.db
      ENABLE_EXPERIMENTAL_COLLECTION: ${ENABLE_EXPERIMENTAL_COLLECTION:-0}
      ALLOW_LEGACY_CRAWLER_DEFAULTS: ${ALLOW_LEGACY_CRAWLER_DEFAULTS:-0}
      CRAWLER_BASE_URL: ${CRAWLER_BASE_URL:-}
    volumes:
      - ai-results:/service/data
volumes:
  ai-results:
